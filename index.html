<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>โปรแกรมคำนวณงานสำรวจ</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1a1d21;--mut:#6b7280;--bd:#d8dce2;--ac:#0b6e4f;--acx:#fff;--hi:#e8f3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b1f25;--tx:#eceff3;--mut:#9aa3af;--bd:#343a43;--ac:#3ecf9a;--acx:#06281c;--hi:#17302a}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b1f25;--tx:#eceff3;--mut:#9aa3af;--bd:#343a43;--ac:#3ecf9a;--acx:#06281c;--hi:#17302a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Sarabun","Noto Sans Thai",system-ui,sans-serif;padding:14px;max-width:560px;margin-inline:auto}
h1{font-size:1.15rem;margin:6px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:.95rem;margin:0 0 10px;color:var(--mut)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label{display:block;font-size:.8rem;color:var(--mut);margin-bottom:4px}
input{width:100%;padding:11px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-family:inherit}
input:focus{outline:2px solid var(--ac);border-color:transparent}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600}
.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.res{background:var(--hi);border-radius:10px;padding:10px 12px;margin-top:10px;font-variant-numeric:tabular-nums}
.res b{display:block;font-size:1.05rem}
.res small{color:var(--mut)}
.err{color:#d33;font-size:.85rem;margin-top:8px;min-height:1em}
.hide{display:none}
.hint{font-size:.78rem;color:var(--mut);margin-top:8px}
</style>
</head>
<body>
<h1>📐 โปรแกรมคำนวณงานสำรวจ</h1>
<div class="tabs">
  <button id="t1" class="on" onclick="tab(1)">AZ &amp; DIST</button>
  <button id="t2" onclick="tab(2)">หาพิกัดจาก AZ+ระยะ</button>
</div>

<!-- TAB 1 -->
<div id="p1">
  <div class="card">
    <h2>จุดตั้งกล้อง (INST)</h2>
    <div class="row">
      <div><label>N (INST)</label><input id="ni" type="number" step="any" inputmode="decimal"></div>
      <div><label>E (INST)</label><input id="ei" type="number" step="any" inputmode="decimal"></div>
    </div>
  </div>
  <div class="card">
    <h2>จุดเล็ง (FS)</h2>
    <div class="row">
      <div><label>N (FS)</label><input id="nf" type="number" step="any" inputmode="decimal"></div>
      <div><label>E (FS)</label><input id="ef" type="number" step="any" inputmode="decimal"></div>
    </div>
    <div class="btns">
      <button class="btn p" onclick="calc1()">คำนวณ</button>
      <button class="btn" onclick="clr1()">ล้างผลลัพธ์</button>
    </div>
    <div class="err" id="e1"></div>
    <div id="out1"></div>
  </div>
</div>

<!-- TAB 2 -->
<div id="p2" class="hide">
  <div class="card">
    <h2>จุดเริ่มต้น</h2>
    <div class="row">
      <div><label>N</label><input id="n0" type="number" step="any" inputmode="decimal"></div>
      <div><label>E</label><input id="e0" type="number" step="any" inputmode="decimal"></div>
    </div>
  </div>
  <div class="card">
    <h2>มุมแอซิมุท (AZ) และระยะ</h2>
    <div class="row3">
      <div><label>องศา °</label><input id="ad" type="number" step="any" inputmode="decimal"></div>
      <div><label>ลิปดา '</label><input id="am" type="number" step="any" inputmode="decimal"></div>
      <div><label>ฟิลิปดา "</label><input id="as" type="number" step="any" inputmode="decimal"></div>
    </div>
    <div style="margin-top:10px"><label>ระยะ (DIST)</label><input id="dd" type="number" step="any" inputmode="decimal"></div>
    <div class="btns">
      <button class="btn p" onclick="calc2()">คำนวณ</button>
      <button class="btn" onclick="clr2()">ล้างผลลัพธ์</button>
    </div>
    <div class="err" id="e2"></div>
    <div id="out2"></div>
    <div class="hint">N = N₀ + DIST·cos(AZ) , E = E₀ + DIST·sin(AZ)</div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const num=id=>{const v=$(id).value.trim();return v===""?NaN:parseFloat(v)};

function tab(n){
  $("p1").classList.toggle("hide",n!==1);
  $("p2").classList.toggle("hide",n!==2);
  $("t1").classList.toggle("on",n===1);
  $("t2").classList.toggle("on",n===2);
}

function dms(g){
  let t=Math.round(g*3600*100)/100;          // รวมเป็นฟิลิปดา ปัดทศนิยม 2 ตำแหน่ง
  if(t>=360*3600) t-=360*3600;
  const d=Math.floor(t/3600);
  const m=Math.floor((t-d*3600)/60);
  const s=t-d*3600-m*60;
  return `${d}° ${m}' ${s.toFixed(2)}"`;
}

let count=0;
function calc1(){
  const ni=num("ni"),ei=num("ei"),nf=num("nf"),ef=num("ef");
  if([ni,ei,nf,ef].some(isNaN)){$("e1").textContent="กรุณากรอก N, E ของ INST และ FS ให้ครบ";return}
  $("e1").textContent="";
  const dn=nf-ni,de=ef-ei;
  const dist=Math.hypot(dn,de);
  let g=Math.atan2(de,dn)*180/Math.PI;
  if(g<0)g+=360;
  count++;
  const div=document.createElement("div");
  div.className="res";
  div.innerHTML=`<small>#${count} &nbsp; FS: N ${nf} , E ${ef}</small>
    <b>AZ = ${dms(g)}</b>
    <small>(${g.toFixed(4)}°)</small>
    <b>DIST = ${dist.toFixed(4)}</b>`;
  $("out1").prepend(div);
  $("nf").value="";$("ef").value="";$("nf").focus();
}
function clr1(){$("out1").innerHTML="";count=0;$("e1").textContent=""}

function calc2(){
  const n0=num("n0"),e0=num("e0"),dist=num("dd");
  let d=num("ad"),m=num("am"),s=num("as");
  if(isNaN(m))m=0; if(isNaN(s))s=0;
  if([n0,e0,dist,d].some(isNaN)){$("e2").textContent="กรุณากรอก N, E, องศา และระยะ";return}
  $("e2").textContent="";
  const az=d+m/60+s/3600, r=az*Math.PI/180;
  const n=n0+dist*Math.cos(r), e=e0+dist*Math.sin(r);
  const div=document.createElement("div");
  div.className="res";
  div.innerHTML=`<small>AZ ${az.toFixed(4)}° &nbsp; DIST ${dist}</small>
    <b>N = ${n.toFixed(4)}</b>
    <b>E = ${e.toFixed(4)}</b>`;
  $("out2").prepend(div);
}
function clr2(){$("out2").innerHTML="";$("e2").textContent=""}

// กด Enter เพื่อคำนวณ
["ni","ei","nf","ef"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")calc1()}));
["n0","e0","ad","am","as","dd"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")calc2()}));
</script>
</body>
</html>
